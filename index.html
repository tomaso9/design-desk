:root{--bg:#1b1917;--panel:#2c2824;--panel2:#3a342e;--edge:#0b0a09;--cream:#e6dcc3;--cream2:#d3c7a7;--ink:#1f1b17;--ink2:#4a4339;--muted:#8c8373;--light:#d9d0bb;
  --red:#9b2d26;--green:#3f7a3c;--amber:#b7801e;--lgreen:#5bc45a;--lamber:#e0a92b;--lred:#e2473c}
*{box-sizing:border-box}
html{height:100%}body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:22px/1.25 "VT323","Courier New",monospace;display:flex;flex-direction:column}
.px{font-family:"Press Start 2P","Courier New",monospace;font-size:10px;line-height:1.6}
button{font:22px "VT323","Courier New",monospace;cursor:pointer}
.btn{background:var(--light);color:#000;border:3px solid var(--edge);padding:6px 16px;box-shadow:3px 3px 0 var(--edge)}
.btn:hover{background:#fff}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.dark{background:var(--panel2);color:var(--light)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
input,select{font:20px "VT323",monospace;background:#000;color:var(--light);border:2px solid var(--light);padding:3px 6px}
#strip{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;color:var(--light);gap:16px;flex-wrap:wrap}
#strip .px{font-size:11px}
#strip .muted{color:var(--muted)}
main{flex:1;display:grid;grid-template-columns:250px 1fr 270px;gap:22px;padding:4px 24px 20px;align-items:start;min-height:0}
main.two{grid-template-columns:270px 1fr}
main.one{grid-template-columns:1fr}
main>*{min-width:0}
main>aside{position:sticky;top:0}
footer{display:flex;gap:16px;align-items:center;padding:8px 24px;background:#000;color:var(--muted);font-size:18px;border-top:3px solid var(--panel2)}
footer .log{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer button{font-size:18px;background:#000;color:var(--light);border:2px solid var(--light);padding:3px 10px}
.panel{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--panel2);color:var(--light)}
.paper{background:var(--cream);border:3px solid var(--edge);box-shadow:5px 5px 0 var(--edge);color:var(--ink)}
.black{background:#000;color:var(--light);border:3px solid var(--edge);padding:10px 14px}
.black .px{color:var(--amber)}
.note{color:var(--muted);font-size:20px}
.hidden{display:none!important}
/* ordinance grid */
.mini{padding:12px 14px}
.mini h4{margin:0 0 10px;font-size:9px;color:var(--amber)}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.cell{background:var(--cream);color:var(--ink);border:2px solid var(--edge);padding:5px 7px;min-height:56px;font-size:19px;line-height:1.1}
.cell small{display:block;font:8px "Press Start 2P",monospace;color:var(--ink2);margin-bottom:4px;line-height:1.4}
.cell.empty{background:var(--panel2);color:var(--muted);border-style:dashed}
.cell.council{background:var(--cream2);color:var(--ink2);font-style:italic}
.cell .chg{display:block;font:8px "Press Start 2P",monospace;color:var(--red);margin-top:3px;line-height:1.4}
.cell .imp{color:var(--ink2);font-size:16px}
.lights{display:flex;gap:3px;margin-top:10px}
.lights span{flex:1;text-align:center;font-size:8px;color:var(--light);background:#000;border:2px solid var(--edge);padding:6px 2px;line-height:1.6;cursor:help}
.dot{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border:1px solid #000}
.dot.green{background:var(--lgreen)}.dot.amber{background:var(--lamber)}.dot.red{background:var(--lred)}.dot.off{background:#555}
.purpose{margin-top:10px;padding:8px 10px;background:var(--cream2);color:var(--ink);border:2px solid var(--edge);font-size:18px}
/* ordinance question */
.ord{padding:30px 36px;max-width:760px;margin:0 auto}
.ord h2{margin:8px 0 4px;font-size:40px;font-weight:normal;line-height:1}
.ord .lead{margin:0 0 20px;color:var(--ink2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--cream);border:3px solid var(--edge);padding:14px 16px;font-size:26px;text-align:left;box-shadow:3px 3px 0 var(--edge);line-height:1.1}
.opt:hover,.opt.sel{background:#000;color:var(--light)}
.opt.sel::after{content:" [x]";color:var(--lgreen)}
.opt kbd{font:9px "Press Start 2P",monospace;color:var(--muted);margin-right:8px;vertical-align:middle}
.fx{display:block;font-size:17px;line-height:1.15;color:var(--ink2);margin-top:5px}
.opt:hover .fx,.opt.sel .fx,.black .fx,.decide button:hover .fx{color:var(--muted)}
.black .fx{margin-top:8px;color:var(--lamber)}
.hint{min-height:64px;margin-top:16px;font-size:21px}
.progress{display:flex;gap:4px;margin-top:22px}
.progress span{flex:1;height:8px;background:var(--cream2);border:2px solid var(--edge)}
.progress span.done{background:var(--ink)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px;flex-wrap:wrap}
/* document */
.doc{padding:34px 36px 26px;position:relative;max-width:640px;margin:0 auto;
  background-image:repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.05) 26px 27px)}
.doc .tab{position:absolute;top:-14px;left:30px;color:#fff;font:8px "Press Start 2P",monospace;padding:5px 10px;border:3px solid var(--edge);border-bottom:0;line-height:1.4}

@media (max-width:900px){#narrow{display:block}main,main.two{grid-template-columns:1fr}main>aside{position:static}}
#err{display:none;position:fixed;left:8px;right:8px;bottom:52px;background:#3a1210;border:3px solid var(--lred);color:#ffd9d6;padding:6px 10px;font:18px "VT323",monospace;z-index:9}
</style>
</head>
<body>
<div id="narrow">Design Desk is built for a laptop screen. It will work here, but it will be cramped.</div>
<div id="strip"></div>
<main id="main"><aside id="left"></aside><section id="center"></section><aside id="right"></aside></main>
<footer id="ftr"></footer>
<div id="err"></div>
<div id="tip"></div>
<script>
'use strict';
function showError(msg){const e=document.getElementById('err');if(!e)return;e.style.display='block';e.textContent='Something went wrong. Please copy this line: '+msg;}
window.onerror=(msg,src,line)=>{ // ignore errors from other origins (browser extensions report as "Script error." with no line)
  if(/^Script error\.?$/i.test(String(msg))||!line)return;if(src&&!src.startsWith(location.origin)&&!src.startsWith('file:'))return;showError(`${msg} (line ${line})`);};
window.addEventListener('unhandledrejection',ev=>showError(String(ev.reason&&ev.reason.stack||ev.reason)));

const IND=['reach','burden','equity','fiscal','political'];
const FIT=['coherence','consistency','congruence'];
const SAVE_KEY='designdesk_v3';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clip=v=>Math.max(0,Math.min(100,Math.round(v)));
let C=null,S=null;

/* ---------- content lookups ---------- */
const choiceById=id=>C.choices.find(c=>c.id===id);
const optById=id=>{for(const ch of C.choices)for(const o of ch.options)if(o.id===id)return o;return null;};
const cardById=id=>C.cards.find(c=>c.id===id);
const evById=id=>C.evaluators.find(e=>e.id===id);
const briefingFor=when=>C.briefings.find(b=>b.when===when)||{title:'',text:''};
const groupMeta=id=>C.setting.groups.find(g=>g.id===id);
function fill(t,vars){return String(t||'').replace(/\{(\w+)\}/g,(m,k)=>vars&&vars[k]!==undefined?vars[k]:(C.setting[k]!==undefined?C.setting[k]:m));}
const shortOf=id=>{const o=optById(id);return o?(o.short||o.label):id;};
const labelOf=id=>{const o=optById(id);return o?o.label:id;};
const labelsOf=v=>Array.isArray(v)?v.map(labelOf).join(' + '):labelOf(v);
const shortsOf=v=>Array.isArray(v)?v.map(shortOf).join(' · '):shortOf(v);

/* ---------- seeded randomness (mulberry32) ---------- */
function hashSeed(str){let h=1779033703^str.length;for(const ch of str){h=Math.imul(h^ch.charCodeAt(0),3432918353);h=h<<13|h>>>19;}return(h>>>0)||1;}
function rnd(){let t=S.rng=(S.rng+0x6D2B79F5)>>>0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- settings from the URL ---------- */
function urlSettings(){const p=new URLSearchParams(location.search);const g=k=>p.get(k);
  return{instructor:g('instructor')==='1',quarters:g('quarters'),cards:g('cards'),decisions:g('decisions'),unlock:g('unlock')==='1',code:g('code')||'',seed:g('seed'),selftest:g('selftest')==='1'};}
function makeCfg(u){const m=C.mode;return{quarters:+(u.quarters||m.quarters),cards:+(u.cards||m.cards_per_quarter),decisions:+(u.decisions||m.decision_cards),unlock:!!u.unlock,evaluators:m.evaluators,debrief:m.debrief};}

/* ---------- active options and conditions ---------- */
function activeIds(){const s=new Set();for(const v of Object.values(S.choices)){if(Array.isArray(v))v.forEach(x=>s.add(x));else if(v)s.add(v);}return s;}
function holds(cond,act){if(!cond||!cond.length)return true;return cond.every(t=>t==='any'||String(t).split('|').some(x=>act.has(x.trim())));}
function activeModifiers(){const a=activeIds();return C.modifiers.filter(m=>holds(m.condition,a));}

/* ---------- indicator math (Section 5) ---------- */
function sumEffects(target,eff,sign){sign=sign||1;for(const k in(eff||{}))if(IND.includes(k)&&k!=='equity')target[k]=(target[k]||0)+sign*eff[k];}
function addGroup(target,gr){for(const k in(gr||{}))target[k]=(target[k]||0)+gr[k];}
function baseEffects(){const t={};activeIds().forEach(id=>{const o=optById(id);if(o)sumEffects(t,o.effects);});return t;}
function groupReach(){const a=activeIds();const out={};
  for(const g of C.setting.groups){let m=1;a.forEach(id=>{const o=optById(id);if(o&&o.group_multipliers&&o.group_multipliers[g.id]!=null)m*=o.group_multipliers[g.id];});
    out[g.id]=clip(S.ind.reach*m+(S.groupAdj[g.id]||0));}
  return out;}
function applyCaps(){for(const m of activeModifiers())for(const k in(m.cap||{}))if(S.ind[k]!=null)S.ind[k]=Math.min(S.ind[k],m.cap[k]);}
function recomputeEquity(){const gr=groupReach();const v=Object.values(gr);S.ind.equity=clip(100-(Math.max(...v)-Math.min(...v)));return gr;}
function runFit(){const a=activeIds();const out={};
  for(const t of FIT){const matched=C.fit_rules.filter(r=>r.type===t&&holds(r.condition,a));
    out[t]={light:matched.some(r=>r.light==='red')?'red':matched.some(r=>r.light==='amber')?'amber':'green',rules:matched.map(r=>r.id)};}
  return out;}
function contributors(ind){const rows=[];activeIds().forEach(id=>{const o=optById(id);if(o&&o.effects&&o.effects[ind])rows.push([o.short||o.label,o.effects[ind]]);});
  activeModifiers().forEach(m=>{if(m.effects&&m.effects[ind])rows.push([m.name||m.id,m.effects[ind]]);});
  rows.sort((x,y)=>Math.abs(y[1])-Math.abs(x[1]));return rows.slice(0,4).map(r=>`${r[0]} ${r[1]>0?'+':''}${r[1]}`).join('\n')||'no active drivers';}
/* results shown to the player: a linear map of one indicator (content: setting.results) */
function resultValue(r,ind){return Math.max(0,Math.round(r.offset+r.scale*ind[r.from]));}
function resultLine(r,ind){if(r.sub)return fill(r.sub.template,{v:Math.max(0,Math.round(r.sub.offset+r.sub.scale*ind[r.sub.from]))});
  const l=(r.lines||[]).find(x=>ind[r.from]>=x.min);return l?fill(l.text):'';}
const resById=id=>C.setting.results.find(r=>r.id===id);
function snapshotResults(){const s={};C.setting.results.forEach(r=>s[r.id]=resultValue(r,S.ind));const gr=groupReach();for(const g in gr)s[g]=gr[g];return s;}
function votes(ind){const r=resById('council');return r?resultValue(r,ind):Math.round(ind.political/20);}
function ending(){return C.setting.endings.find(e=>S.ind.political>=e.min)||C.setting.endings[C.setting.endings.length-1];}
/* promises: each chosen objective carries a target on a result, a group or an indicator (content: choices.objectives[].target) */
function metricValue(m){if(resById(m))return resultValue(resById(m),S.ind);if(groupMeta(m))return groupReach()[m];if(IND.includes(m))return S.ind[m];return 0;}
function objectivesStatus(){return(S.choices.objectives||[]).map(id=>{const o=optById(id);const tg=o&&o.target;if(!tg)return{id,label:o?o.label:id,promise:o&&o.promise||'',met:true,v:null,tg:null};
  const v=metricValue(tg.metric);return{id,label:o.label,promise:o.promise||o.label,met:tg.op==='<='?v<=tg.value:v>=tg.value,v,tg};});}
/* budget: a fixed appropriation that generous settings spend faster (content: setting.budget, option.cost) */
function quarterSpend(){const b=C.setting.budget;if(!b)return 0;let m=1;activeIds().forEach(id=>{const o=optById(id);if(o&&o.cost!=null)m*=o.cost;});return Math.max(0,Math.round(b.quarter_spend_at_reach50*(S.ind.reach/50)*m));}
function planQuarter(){const spend=quarterSpend();S.plan={spend,dryAt:null};if(!C.setting.budget||spend<=S.budget)return;
  const apps=S.deck.map((id,i)=>cardById(id).type==='applicant'?i:-1).filter(i=>i>=0);const allowed=Math.floor(apps.length*(S.budget/Math.max(1,spend)));
  if(allowed<apps.length)S.plan.dryAt=apps[allowed];}
function isDry(card){return!!(C.setting.budget&&S.plan&&S.plan.dryAt!=null&&card.type==='applicant'&&S.cardIdx>=S.plan.dryAt);}
/* money, in dollars (content: setting.budget.total_dollars). The budget is tracked as a percentage of the appropriation. */
function fmtDollars(d){const a=Math.abs(d);const s=a>=1e6?(a/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?Math.round(a/1e3)+'k':String(Math.round(a));return(d<0?'-':'')+'$'+s;}
function pctDollars(pct){const b=C.setting.budget;return b&&b.total_dollars?pct/100*b.total_dollars:0;}
function baselineQuarterSpend(){const b=C.setting.budget;if(!b)return 0;let m=1;activeIds().forEach(id=>{const o=optById(id);if(o&&o.cost!=null)m*=o.cost;});return b.quarter_spend_at_reach50*m;}
function optionBudgetLine(o){const b=C.setting.budget;if(!b||o.cost==null||o.cost===1)return'';
  // cost of this option relative to the others on the same question, holding everything else at the current design
  const base=baselineQuarterSpend();const ch=C.choices.find(c=>c.options.includes(o));const cur=optById(S.choices[ch.id]);const curCost=cur&&cur.cost!=null?cur.cost:1;
  const d=pctDollars(base/curCost*(o.cost-curCost));if(Math.abs(d)<5e4)return'About the same cost as the current setting';return`${d>0?'Costs about '+fmtDollars(d)+' more':'Saves about '+fmtDollars(-d)} per year`;}
function householdDollars(card,o){const b=C.setting.budget;if(!b||card.type!=='applicant')return 0;const pays=o.pays!=null?o.pays:((b.paid_results||[]).includes(o.result)?1:0);if(!pays)return 0;
  const dur=optById(S.choices.duration),cap=optById(S.choices.benefit_cap);return Math.round(b.case_dollars_per_month*(dur&&dur.months||6)*(cap&&cap.cost!=null?cap.cost:1)*pays);}
function budgetFxLine(o){const v=(o.effects||{}).budget;if(!v)return'';return v<0?`Sets a precedent: about ${fmtDollars(pctDollars(-v))} of the appropriation across cases like this`:`Recovers about ${fmtDollars(pctDollars(v))} for the appropriation`;}
function dryOutcome(card){const b=C.setting.budget;const gr={};if(card.group)gr[card.group]=b.dry_group_reach||0;return{result:b.dry_result,text:fill(b.dry_text),effects:b.dry_effects||{},group_reach:gr};}

/* ---------- state ---------- */
function newState(u){const seed=(u.seed||C.setting.default_seed||'10').toString();
  S={cfg:makeCfg(u),seed,rng:hashSeed(seed),phase:'start',step:0,choices:{},source:{},purpose:'',quarter:0,ind:{},groupAdj:{},history:[],fitHistory:[],changes:[],log:[],memos:[],used:[],queue:[],firedMods:[],deck:[],cardIdx:0,qCards:[],resolved:null,evas:null,tab:'who',
    budget:C.setting.budget?C.setting.budget.total:0,plan:null,promises:null};
  for(const[k,v]of Object.entries(C.lite.council_defaults)){S.choices[k]=v;S.source[k]='council';}}
function log(text){S.log.push({q:S.quarter,text});}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function loadSaved(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function setChoice(chId,val){const ch=choiceById(chId);const prev=S.choices[chId];if(JSON.stringify(prev)===JSON.stringify(val))return;
  S.choices[chId]=val;S.source[chId]='student';
  if(chId==='causal_story'&&C.lite.implied[val])for(const[k,v]of Object.entries(C.lite.implied[val])){S.choices[k]=v;S.source[k]='implied';}
  if(S.phase==='adjust'){const d={};const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
    arr(prev).forEach(id=>sumEffects(d,optById(id).effects,-1));arr(val).forEach(id=>sumEffects(d,optById(id).effects,1));
    for(const k in d)S.ind[k]=clip(S.ind[k]+d[k]);applyCaps();recomputeEquity();
    const i=S.changes.findIndex(c=>c.q===S.quarter&&c.choice===chId);
    if(i>=0){if(JSON.stringify(S.changes[i].from)===JSON.stringify(val))S.changes.splice(i,1);else S.changes[i].to=val;}
    else S.changes.push({q:S.quarter,choice:chId,level:ch.level,from:prev,to:val});
    log(`Redesign before Year ${S.quarter}: ${ch.name} ${labelsOf(prev)} -> ${labelsOf(val)}`);}}
function designCode(){return'DD'+C.lite.choices.map(id=>{const ch=choiceById(id);const v=S.choices[id];const idx=x=>ch.options.findIndex(o=>o.id===x)+1;
  if(ch.pick)return(v||[]).map(idx).filter(n=>n>0).sort().join('')||'0';return v?String(idx(v)):'0';}).join('-');}
function loadDesignCode(code){const parts=String(code||'').trim().replace(/^DD/i,'').split('-');if(parts.length!==C.lite.choices.length)return'Code must have '+C.lite.choices.length+' parts.';
  const vals={};for(let i=0;i<parts.length;i++){const ch=choiceById(C.lite.choices[i]);const p=parts[i];
    if(ch.pick){const ids=p.split('').map(d=>ch.options[+d-1]&&ch.options[+d-1].id).filter(Boolean);if(ids.length!==ch.pick)return`Part ${i+1} must list ${ch.pick} objectives.`;vals[ch.id]=ids;}
    else{const o=ch.options[+p-1];if(!o)return`Part ${i+1} is not a valid option.`;vals[ch.id]=o.id;}}
  for(const[k,v]of Object.entries(vals))setChoice(k,v);return'';}
function stepComplete(i){const ch=choiceById(C.lite.choices[i]);const v=S.choices[ch.id];return ch.pick?(Array.isArray(v)&&v.length===ch.pick):!!v;}
function designComplete(){return C.lite.choices.every((_,i)=>stepComplete(i));}
function statementOfPurpose(){const g=k=>{const o=optById(S.choices[k]);return o&&o.purpose?o.purpose:labelOf(S.choices[k]);};return fill(C.setting.purpose_template,{cs:g('causal_story'),gg:g('governance_goal'),il:g('instrument_logic')});}
function baseFor(k){const b=C.setting.baseline;return typeof b==='object'?(b[k]!=null?b[k]:(b.default!=null?b.default:50)):b;} // baseline may be one number or {default, political, ...}
function adopt(){const b=baseEffects();for(const k of IND){if(k!=='equity')S.ind[k]=clip(baseFor(k)+(b[k]||0));}
  applyCaps();const gr=recomputeEquity();S.purpose=statementOfPurpose();
  S.history.push({q:0,ind:Object.assign({},S.ind),groups:gr,budget:S.budget});S.fitHistory.push({label:'Design',fit:runFit()});
  log('Ordinance passed: '+C.lite.choices.map(k=>`${choiceById(k).name}=${labelsOf(S.choices[k])}`).join('; ')+` | code ${designCode()}`);
  const parts=[...activeIds()].map(optById).filter(o=>o&&o.effects&&o.effects.political).map(o=>`${o.short||o.label} ${o.effects.political>0?'+':''}${o.effects.political}`);
  log(`Council support starts at ${S.ind.political}: ${baseFor('political')} baseline${parts.length?' '+(b.political>=0?'+':'')+b.political+' from your ordinance ('+parts.join(', ')+')':''}`);

/* ---------- quarter flow ---------- */
function editableChoices(){return C.lite.redesign_adjustable.concat(S.cfg.unlock?C.lite.q2_unlock:[]);}
function canEdit(chId){return S.phase==='adjust'&&editableChoices().includes(chId);}
function quarterBriefing(){const q=S.quarter;const has=w=>C.briefings.some(b=>b.when===w);const last=Math.max(...C.briefings.map(b=>+(String(b.when).match(/^q(\d+)/)||[0,0])[1]));
  const n=has('q'+q)?q:last; // instructor-added quarters past the written briefings reuse the last one
  return S.cfg.unlock&&q>1&&has(`q${n}_unlock`)?briefingFor(`q${n}_unlock`):briefingFor('q'+n);}
const isDecision=c=>Array.isArray(c.choices)&&c.choices.length>0;
function buildDeck(q){const cfg=S.cfg;const a=activeIds();const deck=[];const push=c=>{if(c&&!deck.includes(c))deck.push(c);};
  const due=S.queue.filter(x=>x.q<=q);S.queue=S.queue.filter(x=>x.q>q);due.forEach(f=>push(cardById(f.card)));
  for(const m of activeModifiers())if(m.forced_card&&!S.firedMods.includes(m.id)){S.firedMods.push(m.id);push(cardById(m.forced_card));}
  const pool=C.cards.filter(c=>!c.follow_up_only&&(c.quarter_min||1)<=q&&holds(c.appears_when,a));
  const fresh=pool.filter(c=>!S.used.includes(c.id));
  const pick=f=>{let cands=fresh.filter(c=>!deck.includes(c)&&f(c));if(!cands.length)cands=pool.filter(c=>!deck.includes(c)&&f(c));if(!cands.length)return null;const c=cands[Math.floor(rnd()*cands.length)];deck.push(c);return c;};
  let nd=deck.filter(isDecision).length;while(nd<cfg.decisions&&deck.length<cfg.cards){if(!pick(isDecision))break;nd++;}
  const shares=C.setting.card_type_shares,types=Object.keys(shares),total=types.reduce((s,t)=>s+shares[t],0);
  while(deck.length<cfg.cards){let r=rnd()*total,type=types[0];for(const t of types){r-=shares[t];if(r<0){type=t;break;}}
    if(!pick(c=>!isDecision(c)&&c.type===type)&&!pick(c=>!isDecision(c))&&!pick(()=>true))break;}
  shuffle(deck);deck.forEach(c=>{if(!S.used.includes(c.id))S.used.push(c.id);});S.deck=deck.map(c=>c.id);S.cardIdx=0;
  if(deck.length<cfg.cards)log(`Deck ran short: ${deck.length} of ${cfg.cards} cards available this year`);}
function startCards(){buildDeck(S.quarter);planQuarter();S.phase='cards';S.qCards=[];S.resolved=null;S.ledger={start:S.ind.political,cards:0,drift:0,standing:0,dry:0,promises:0};
  if(S.plan.dryAt!=null)log(`Year ${S.quarter}: planned spend ${S.plan.spend}% against ${S.budget}% remaining; funds run out at case ${S.plan.dryAt+1}`);}
function resolveAuto(card){const a=activeIds();return(card.outcomes||[]).find(o=>holds(o.when,a))||card.default||{result:'PROCESSED',text:'',effects:{}};}
function applyOutcome(card,o,choiceLabel){S.qCards.push({id:card.id,title:fill(card.title),result:o.result,effects:o.effects||{},group_reach:o.group_reach||{},choice:choiceLabel||null});
  const bfx=(o.effects||{}).budget||0;if(bfx){S.budget=Math.max(0,Math.min(100,S.budget+bfx));}
  if(S.ledger)S.ledger.cards+=(o.effects||{}).political||0;
  if(S.resolved){S.resolved.dollars=householdDollars(card,o);S.resolved.budgetLine=budgetFxLine(o);}
  // the case moves the dials now, not at quarter end, so the panel on the right answers "what did that just do?"
  const before=snapshotResults();const d={};sumEffects(d,o.effects);for(const k in d)S.ind[k]=clip(S.ind[k]+d[k]);addGroup(S.groupAdj,o.group_reach);applyCaps();recomputeEquity();
  const after=snapshotResults();S.lastFx={};for(const k in after)if(after[k]!==before[k])S.lastFx[k]=after[k]-before[k];
  if(o.follow_up){let fu=o.follow_up;if(o.follow_up_alt&&o.follow_up_chance!=null&&rnd()>=o.follow_up_chance)fu=o.follow_up_alt;S.queue.push({card:fu,q:S.quarter+1});}
  const eff=Object.entries(o.effects||{}).map(([k,v])=>`${k} ${v>0?'+':''}${v}`).join(', ');
  log(`Year ${S.quarter} ${fill(card.title)}: ${o.result}${choiceLabel?' ['+choiceLabel+']':''}${eff?' ('+eff+')':''}`);}
function decide(idx){const card=cardById(S.deck[S.cardIdx]);if(!card||!isDecision(card)||S.resolved)return;const ch=card.choices[idx];if(!ch)return;
  S.resolved={result:ch.result,text:ch.text};applyOutcome(card,ch,ch.label);render();}
function currentCard(){const card=cardById(S.deck[S.cardIdx]);if(card&&!S.resolved&&(!isDecision(card)||isDry(card))){const o=isDry(card)?dryOutcome(card):resolveAuto(card);S.resolved={result:o.result,text:o.text};applyOutcome(card,o);}return card;}
function nextCard(){S.resolved=null;S.lastFx=null;S.cardIdx++;if(S.cardIdx>=S.deck.length)endQuarter();render();}
function endQuarter(){const q=S.quarter;const d={};
  const L=S.ledger||(S.ledger={start:S.ind.political,cards:0,drift:0,standing:0,dry:0,promises:0});
  for(const m of activeModifiers()){sumEffects(d,m.effects);addGroup(S.groupAdj,m.group_reach);L.standing+=(m.effects||{}).political||0;} // card effects were applied as each case resolved
  for(const dr of(C.setting.quarter_drift||[])){const v=Math.round(dr.per_point*(S.ind[dr.from]-dr.center));if(v){d[dr.to]=(d[dr.to]||0)+v;if(dr.to==='political')L.drift+=v;log(`Year ${q} ${dr.label||dr.from+' -> '+dr.to}: ${v>0?'+':''}${v}`);}}
  const b=C.setting.budget;if(b&&S.plan){const spent=Math.min(S.plan.spend,S.budget);S.budget-=spent;log(`Year ${q} budget: spent ${fmtDollars(pctDollars(spent))}, ${fmtDollars(pctDollars(S.budget))} remaining`);
    if(S.plan.dryAt!=null){sumEffects(d,b.dry_quarter_effects);L.dry+=(b.dry_quarter_effects||{}).political||0;log(fill(b.dry_headline));}}
  for(const k in d)S.ind[k]=clip(S.ind[k]+d[k]);applyCaps();
  if(q>=S.cfg.quarters){const st=objectivesStatus();S.promises=st;const missed=st.filter(o=>!o.met),kept=st.filter(o=>o.met);
    const pen=(C.setting.missed_objective_penalty||0)*missed.length,bonus=(C.setting.kept_objective_bonus||0)*kept.length;S.promiseFx={pen,bonus};L.promises=bonus-pen;
    S.ind.political=clip(S.ind.political-pen+bonus);
    log(`Promises: ${kept.length} kept (+${bonus} council support), ${missed.length} missed (-${pen})${missed.length?': '+missed.map(o=>o.promise).join('; '):''}`);}
  log(`Year ${q} council support ${L.start} -> ${S.ind.political}: cases ${L.cards>=0?'+':''}${L.cards}, results ${L.drift>=0?'+':''}${L.drift}, standing effects of your design ${L.standing>=0?'+':''}${L.standing}`+(L.dry?`, money ran out ${L.dry}`:'')+(L.promises?`, promises ${L.promises>0?'+':''}${L.promises}`:''));
  const gr=recomputeEquity();
  S.history.push({q,ind:Object.assign({},S.ind),groups:gr,budget:S.budget});S.fitHistory.push({label:'Year '+q,fit:runFit()});
  // evaluators scheduled for this quarter; if the instructor added quarters past the schedule, the final quarter reuses the last scheduled set
  const keys=Object.keys(S.cfg.evaluators).map(Number).sort((a,b)=>a-b);
  const evs=S.cfg.evaluators[String(q)]||(q===S.cfg.quarters&&keys.length?S.cfg.evaluators[String(keys[keys.length-1])]:[]);
  evs.forEach(id=>S.memos.push({q,ev:id,text:memoText(id)}));
  log(`Year ${q} closed: `+IND.map(k=>`${k} ${S.ind[k]}`).join(', ')+(activeModifiers().length?' | standing effects of your design: '+activeModifiers().map(m=>m.name||m.id).join('; '):''));
  S.phase='memo';}
function continueAfterMemo(){if(S.quarter>=S.cfg.quarters){S.phase='end';log('Verdict: '+ending().stamp);return;}S.quarter++;S.phase='adjust';}

/* ---------- evaluator memos (Section 7) ---------- */
function memoScore(ev){const w=ev.weights||{};let s=0,tw=0;for(const k in w){s+=w[k]*(k==='burden'?100-S.ind.burden:S.ind[k]);tw+=w[k];}return tw?Math.round(s/tw):0;}
function memoVerdict(ev){const score=memoScore(ev);return(ev.verdicts||[]).find(v=>score>=v.min)||{tone:'mixed',seal:'',text:''};}
function memoText(evId){const ev=evById(evId);const v=memoVerdict(ev);
  const mag=c=>Object.values(c.effects||{}).reduce((s,x)=>s+Math.abs(x),0)+Object.values(c.group_reach||{}).reduce((s,x)=>s+Math.abs(x),0)/3;
  const cards=S.qCards.slice().sort((a,b)=>mag(b)-mag(a)).slice(0,2).map(c=>`${c.title} (${c.result.toLowerCase()})`).join('; ')||'none';
  const gr=groupReach();const worst=C.setting.groups.reduce((a,g)=>gr[g.id]<gr[a.id]?g:a,C.setting.groups[0]);
  const vars={evaluator:ev.name,q:S.quarter,score:memoScore(ev),verdict:v.text,cards,purpose:S.purpose,objectives:labelsOf(S.choices.objectives),worst_group:worst.name.toLowerCase(),worst_pct:gr[worst.id],
    helped:resultValue(resById('helped'),S.ind),improper:resultValue(resById('money'),S.ind),votes:votes(S.ind),budget:fmtDollars(pctDollars(S.budget)),budget_pct:S.budget,
    promises:objectivesStatus().map(o=>`${o.promise} ${o.met?'kept':'missed'}`).join(', ')};

function ledgerText(){const L=S.ledger;if(!L)return'';const parts=[];if(L.cards)parts.push(`cases ${L.cards>0?'+':''}${L.cards}`);if(L.drift)parts.push(`results ${L.drift>0?'+':''}${L.drift}`);if(L.standing)parts.push(`standing effects of your design ${L.standing>0?'+':''}${L.standing}`);if(L.dry)parts.push(`money ran out ${L.dry}`);if(L.promises)parts.push(`promises ${L.promises>0?'+':''}${L.promises}`);

function validateContent(){const w=[];const ids=new Set();C.choices.forEach(c=>c.options.forEach(o=>ids.add(o.id)));const cardIds=new Set(C.cards.map(c=>c.id));
  const chk=(cond,where)=>(cond||[]).forEach(t=>t!=='any'&&String(t).split('|').forEach(x=>{if(!ids.has(x.trim()))w.push(`${where}: unknown option "${x.trim()}"`);}));
  C.fit_rules.forEach(r=>chk(r.condition,'fit_rule '+r.id));C.modifiers.forEach(m=>{chk(m.condition,'modifier '+m.id);if(m.forced_card&&!cardIds.has(m.forced_card))w.push(`modifier ${m.id}: unknown card ${m.forced_card}`);});
  C.cards.forEach(c=>{chk(c.appears_when,'card '+c.id);(c.outcomes||[]).forEach(o=>{chk(o.when,'card '+c.id);if(o.follow_up&&!cardIds.has(o.follow_up))w.push(`card ${c.id}: unknown follow_up ${o.follow_up}`);});
    (c.choices||[]).forEach(ch=>['follow_up','follow_up_alt'].forEach(k=>{if(ch[k]&&!cardIds.has(ch[k]))w.push(`card ${c.id}: unknown ${k} ${ch[k]}`);}));
    if(!c.outcomes&&!c.default&&!c.choices)w.push(`card ${c.id}: no outcomes, default or choices`);});
  Object.values(C.mode.evaluators).flat().forEach(e=>{if(!evById(e))w.push(`mode: unknown evaluator ${e}`);});
  C.lite.choices.forEach(id=>{if(!choiceById(id))w.push(`lite.choices: unknown choice ${id}`);});
  Object.values(C.lite.implied).forEach(o=>Object.values(o).forEach(x=>{if(!ids.has(x))w.push(`lite.implied: unknown option ${x}`);}));
  Object.values(C.lite.council_defaults).forEach(x=>{if(!ids.has(x))w.push(`lite.council_defaults: unknown option ${x}`);});
  C.setting.results.forEach(r=>{if(!IND.includes(r.from))w.push(`result ${r.id}: unknown indicator ${r.from}`);});
  return w;}
function selfTest(){const out=[];const t=(name,ok)=>out.push((ok?'PASS':'FAIL')+' '+name);const keep=S;
  try{newState({seed:'10'});loadDesignCode('DD1-23-2-2-1-3');t('design code round-trips',designCode()==='DD1-23-2-2-1-3');
    t('implied choices set',S.choices.governance_goal==='gg_market'&&S.choices.instrument_logic==='il_financial');
    t('condition OR/AND',holds(['cs_market','doc_self|doc_full'],activeIds())&&!holds(['doc_full'],activeIds()));
    adopt();t('indicators in range',IND.every(k=>S.ind[k]>=0&&S.ind[k]<=100));
    const gr=groupReach();t('equity is 100 minus spread',S.ind.equity===clip(100-(Math.max(...Object.values(gr))-Math.min(...Object.values(gr)))));
    t('votes 0..5',votes(S.ind)>=0&&votes(S.ind)<=5);
    buildDeck(1);const d1=S.deck.slice();t('deck size',d1.length===S.cfg.cards);t('decision cards',d1.filter(id=>isDecision(cardById(id))).length===S.cfg.decisions);
    newState({seed:'10'});loadDesignCode('DD1-23-2-2-1-3');adopt();buildDeck(1);t('same seed, same deck',JSON.stringify(S.deck)===JSON.stringify(d1));
    newState({seed:'11'});loadDesignCode('DD1-23-2-2-1-3');adopt();buildDeck(1);t('different seed, different deck',JSON.stringify(S.deck)!==JSON.stringify(d1));
    S.choices.causal_story='cs_shortage';S.ind.reach=90;applyCaps();t('reach ceiling modifier',S.ind.reach===60);
    t('fit lights computed',FIT.every(k=>['green','amber','red'].includes(runFit()[k].light)));
    S.ind.political=10;t('low support ends in dismissal',ending().min===0);
    t('content references valid',validateContent().length===0);
  }catch(e){out.push('FAIL exception: '+e.message);}
  S=keep;return out;}

/* ---------- boot ---------- */
// one tooltip box for every element with data-tip (the browser's own tooltips are too slow to notice); .opt uses the hint box instead
document.addEventListener('mouseover',e=>{const tip=$('tip');const el=e.target.closest?e.target.closest('[data-tip]'):null;
  if(!el||!el.dataset.tip||el.classList.contains('opt')){tip.style.display='none';return;}tip.textContent=el.dataset.tip;tip.style.display='block';});
document.addEventListener('mousemove',e=>{const tip=$('tip');if(tip.style.display!=='block')return;
  tip.style.left=Math.max(8,Math.min(e.clientX+16,window.innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(8,Math.min(e.clientY+16,window.innerHeight-tip.offsetHeight-8))+'px';});
document.addEventListener('keydown',e=>{if(!S||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(/^[1-5]$/.test(e.key)){const b=document.querySelector(`.decide [data-idx="${+e.key-1}"]`)||(S.phase==='ordinance'?document.querySelectorAll('.ord .opt')[+e.key-1]:null);if(b){b.click();e.preventDefault();}}
  else if(e.key==='Enter'||e.key===' '){const b=$('nextBtn');if(b&&!b.disabled&&document.activeElement.tagName!=='BUTTON'){b.click();e.preventDefault();}}});
function init(){newState(urlSettings());S.phase='start';render();}
function boot(content){C=content;const w=validateContent();if(w.length)console.warn('content.json warnings:\n'+w.join('\n'));init();}
fetch('content.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(boot).catch(err=>{
  $('center').innerHTML=`<div class="paper start"><h2>Load content.json</h2><p>This page could not read <code>content.json</code> automatically (${esc(err.message)}). Browsers block this when the page is opened as a file. Host the folder on a web server, or pick the file here:</p><input type="file" id="pick" accept=".json"></div>`;
  $('pick').onchange=e=>{const f=e.target.files[0];const rd=new FileReader();rd.onload=()=>{try{boot(JSON.parse(rd.result));}catch(x){alert('content.json is not valid JSON: '+x.message);}};rd.readAsText(f);};});
</script>
